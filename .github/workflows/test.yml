name: Run Login Tests

on:
  push:
  schedule:
    - cron: '0 6 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - uses: browser-actions/setup-chrome@v2
      - run: pip install -r requirements.txt
      - run: pytest test_login.py --html=report.html --self-contained-html

      - name: Send email report
        if: always()
        uses: dawidd6/action-send-mail@v17
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: Login Test Report
          to: srimathirb@gmail.com,ujwal99arak@gmail.com
          from: GitHub Actions <srimathirb@gmail.com>
          body: Test run finished. Check the Actions tab for full logs.
          attachments: report.html,screenshots/valid_login_result.png,screenshots/invalid_login_result.png